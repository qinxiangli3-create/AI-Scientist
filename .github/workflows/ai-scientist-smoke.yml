name: AI Scientist Smoke Test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Run AI Scientist smoke test
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python launch_scientist.py \
            --model "github/gpt-4o" \
            --experiment "nanoGPT_lite" \
            --num-ideas 1 \
            --skip-novelty-check

      - name: Upload workspace artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-test-workspace
          path: |
            .
            !.git
            !**/__pycache__
            !**/*.pyc
